<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Terraswarm - 3D Greek-mythology-inspired MMO prototype" />
    <title>Terraswarm | 3D Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Terraswarm 3D prototype">
      <div id="game-canvas-container"></div>

      <section class="hud" aria-label="Game information">
        <div class="brand-panel">
          <p class="eyebrow">Terraswarm</p>
          <h1>Gaia: First Steps</h1>
          <p class="status"><span class="status-dot"></span> Prototype world online</p>
        </div>

        <div class="controls-panel">
          <p class="panel-label">Movement</p>
          <div class="key-row">
            <span class="key">W</span>
            <span class="key">A</span>
            <span class="key">S</span>
            <span class="key">D</span>
          </div>
          <p class="hint">W/S move · A/D turn · Drag to look · Space fly · Shift sprint</p>
        </div>

        <div class="coordinates-panel" aria-live="polite">
          <p class="panel-label">Position</p>
          <p id="position-readout">X 0.0 &nbsp; Z 0.0</p>
        </div>

        <div class="energy-panel">
          <div class="energy-label">
            <span>Energy</span>
            <span id="energy-readout">100 / 100</span>
          </div>
          <div class="energy-bar"><div id="energy-fill"></div></div>
          <p id="movement-state">Grounded</p>
        </div>
      </section>

      <div id="loading-message" class="loading-message">Loading world…</div>
      <div id="error-message" class="error-message" hidden>
        The prototype could not start. Please run it through a local web server.
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
